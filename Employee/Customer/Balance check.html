<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>S.K Zero Balance Bank - Balance Check</title>

<style>
*{
  box-sizing: border-box;
  font-family: Arial, sans-serif;
  margin: 0;
  padding: 0;
}

body{
  min-height: 100vh;
  background: linear-gradient(135deg, #020617, #0f172a, #1e293b);
  padding: 20px 15px;
  color: white;
}

.container{
  max-width: 600px;
  margin: auto;
}

@keyframes slideDown{
  from{
    opacity: 0;
    transform: translateY(-25px);
  }
  to{
    opacity: 1;
    transform: translateY(0);
  }
}

@keyframes slideUp{
  from{
    opacity: 0;
    transform: translateY(25px);
  }
  to{
    opacity: 1;
    transform: translateY(0);
  }
}

.header{
  background: rgba(255, 255, 255, 0.08);
  backdrop-filter: blur(15px);
  border: 1px solid rgba(255, 255, 255, 0.15);
  text-align: center;
  padding: 24px;
  border-radius: 20px;
  margin-bottom: 20px;
  box-shadow: 0 15px 40px rgba(0, 0, 0, 0.3);
  animation: slideDown 0.6s ease;
}

.header h1{
  color: #7dd3fc;
  font-size: 26px;
  margin-bottom: 6px;
}

.header p{
  color: #cbd5e1;
  font-size: 14px;
}

.card{
  background: rgba(255, 255, 255, 0.08);
  backdrop-filter: blur(15px);
  border: 1px solid rgba(255, 255, 255, 0.15);
  padding: 26px;
  border-radius: 20px;
  margin-bottom: 20px;
  box-shadow: 0 15px 40px rgba(0, 0, 0, 0.25);
  animation: slideUp 0.6s ease;
}

h2{
  text-align: center;
  color: #7dd3fc;
  margin-bottom: 18px;
  font-size: 22px;
}

label{
  display: block;
  font-weight: bold;
  font-size: 14px;
  color: #cbd5e1;
  margin: 14px 0 6px;
}

input{
  width: 100%;
  padding: 14px;
  border: none;
  border-radius: 12px;
  font-size: 16px;
  background: #f8fafc;
  color: #111827;
  outline: none;
  transition: box-shadow 0.25s ease;
}

input:focus{
  box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.3);
}

button{
  width: 100%;
  padding: 14px;
  border: none;
  border-radius: 12px;
  background: linear-gradient(135deg, #0284c7, #2563eb);
  color: white;
  font-size: 16px;
  font-weight: bold;
  cursor: pointer;
  margin-top: 16px;
  transition: transform 0.25s ease, box-shadow 0.25s ease;
  box-shadow: 0 4px 14px rgba(37, 99, 235, 0.3);
}

button:hover{
  transform: translateY(-2px);
  box-shadow: 0 8px 25px rgba(37, 99, 235, 0.45);
}

.msg{
  display: none;
  padding: 13px;
  margin-top: 15px;
  border-radius: 10px;
  text-align: center;
  font-weight: bold;
  font-size: 14px;
  animation: slideDown 0.3s ease;
  line-height: 1.5;
}

.error{
  background: rgba(239, 68, 68, 0.15);
  border: 1px solid #ef4444;
  color: #fecaca;
}

.result-box{
  display: none;
  margin-top: 20px;
  background: rgba(0, 0, 0, 0.2);
  padding: 20px;
  border-radius: 14px;
  animation: slideUp 0.4s ease;
}

.balance-card{
  background: linear-gradient(135deg, rgba(34, 197, 94, 0.15), rgba(16, 185, 129, 0.1));
  border: 1px solid #22c55e;
  padding: 18px;
  border-radius: 12px;
  text-align: center;
  margin-bottom: 16px;
}

.balance-label{
  font-size: 14px;
  color: #86efac;
  margin-bottom: 4px;
}

.balance-value{
  font-size: 32px;
  font-weight: bold;
  color: #4ade80;
}

.detail-row{
  display: flex;
  justify-content: space-between;
  padding: 10px 0;
  border-bottom: 1px solid rgba(255, 255, 255, 0.1);
  font-size: 15px;
}

.detail-row:last-child{
  border-bottom: none;
}

.detail-label{
  color: #94a3b8;
}

.detail-value{
  font-weight: bold;
  color: #f8fafc;
}
</style>
</head>

<body>

<div class="container">

<div class="header">
  <h1>🏦 S.K Zero Balance Bank</h1>
  <p>Instant Balance Enquiry Portal</p>
</div>

<div class="card">
  <h2>🔍 Check Account Balance</h2>

  <label for="mobileInput">Registered Mobile Number</label>
  <input 
    type="tel" 
    id="mobileInput" 
    placeholder="Enter 10-digit mobile number" 
    maxlength="10"
    inputmode="numeric"
  >

  <button onclick="checkBalance()">Submit</button>

  <div id="errorMsg" class="msg error"></div>

  <div id="resultBox" class="result-box">
    <div class="balance-card">
      <div class="balance-label">Available Balance</div>
      <div id="displayBalance" class="balance-value">₹0.00</div>
    </div>

    <div class="detail-row">
      <span class="detail-label">Full Name:</span>
      <span id="displayName" class="detail-value"></span>
    </div>

    <div class="detail-row">
      <span class="detail-label">Account Number:</span>
      <span id="displayAccount" class="detail-value"></span>
    </div>
  </div>
</div>

</div>

<script>
const CUSTOMER_KEY = "sk_zero_balance_customer";

function formatMoney(amount){
  return "₹" + Number(amount || 0).toLocaleString("en-IN", {
    minimumFractionDigits: 2,
    maximumFractionDigits: 2
  });
}

function checkBalance(){
  const mobileInput = document.getElementById("mobileInput").value.trim();
  const errorMsg = document.getElementById("errorMsg");
  const resultBox = document.getElementById("resultBox");

  errorMsg.style.display = "none";
  resultBox.style.display = "none";

  if(!mobileInput){
    errorMsg.textContent = "Please enter your mobile number.";
    errorMsg.style.display = "block";
    return;
  }

  if(!/^[0-9]{10}$/.test(mobileInput)){
    errorMsg.textContent = "Please enter a valid 10-digit mobile number.";
    errorMsg.style.display = "block";
    return;
  }

  const rawData = localStorage.getItem(CUSTOMER_KEY);
  if(!rawData){
    errorMsg.textContent = "No registered customer found.";
    errorMsg.style.display = "block";
    return;
  }

  let customerData = JSON.parse(rawData);
  let matchedCustomer = null;

  if(Array.isArray(customerData)){
    matchedCustomer = customerData.find(c => String(c.mobile).trim() === mobileInput);
  } else {
    if(String(customerData.mobile).trim() === mobileInput){
      matchedCustomer = customerData;
    }
  }

  if(!matchedCustomer){
    errorMsg.textContent = "No customer found registered with this mobile number.";
    errorMsg.style.display = "block";
    return;
  }

  document.getElementById("displayName").textContent = matchedCustomer.fullName || (matchedCustomer.firstName + " " + matchedCustomer.lastName);
  document.getElementById("displayAccount").textContent = matchedCustomer.accountNumber || "N/A";
  document.getElementById("displayBalance").textContent = formatMoney(matchedCustomer.balance || 0);

  resultBox.style.display = "block";
}
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>S.K Zero Balance Bank - Customer Registration</title>

<style>
*{
  box-sizing:border-box;
  font-family:Arial,sans-serif;
  margin:0;
  padding:0;
}

body{
  min-height:100vh;
  background:linear-gradient(135deg,#020617,#0f172a,#1e293b);
  padding:20px 15px;
  color:#1e293b;
}

.container{
  max-width:650px;
  margin:auto;
}

@keyframes slideDown{
  from{
    opacity:0;
    transform:translateY(-30px);
  }
  to{
    opacity:1;
    transform:translateY(0);
  }
}

@keyframes slideUp{
  from{
    opacity:0;
    transform:translateY(30px);
  }
  to{
    opacity:1;
    transform:translateY(0);
  }
}

@keyframes stepSlideIn{
  from{
    opacity:0;
    transform:translateX(30px);
  }
  to{
    opacity:1;
    transform:translateX(0);
  }
}

@keyframes pulseGlow{
  0%,100%{
    transform:scale(1);
    box-shadow:0 0 0 0 rgba(56,189,248,0.4);
  }
  50%{
    transform:scale(1.04);
    box-shadow:0 0 0 12px rgba(56,189,248,0);
  }
}

.header{
  background:rgba(255,255,255,0.08);
  backdrop-filter:blur(15px);
  border:1px solid rgba(255,255,255,0.15);
  color:white;
  text-align:center;
  padding:24px;
  border-radius:20px;
  margin-bottom:20px;
  box-shadow:0 15px 40px rgba(0,0,0,0.3);
  animation:slideDown 0.6s ease;
}

.header h1{
  color:#7dd3fc;
  font-size:26px;
  margin-bottom:6px;
}

.header p{
  color:#cbd5e1;
  font-size:14px;
}

.card{
  background:#ffffff;
  padding:26px;
  border-radius:20px;
  margin-bottom:20px;
  box-shadow:0 15px 40px rgba(0,0,0,0.25);
  border:1px solid rgba(255,255,255,0.4);
  animation:slideUp 0.6s ease;
}

h2{
  text-align:center;
  color:#0f172a;
  margin-bottom:18px;
  font-size:22px;
}

.step{
  display:none;
}

.step.active{
  display:block;
  animation:stepSlideIn 0.4s ease;
}

.step-indicator{
  text-align:center;
  font-size:13px;
  font-weight:bold;
  color:#0284c7;
  background:#f0f9ff;
  display:inline-block;
  padding:6px 16px;
  border-radius:20px;
  margin-bottom:16px;
  border:1px solid #bae6fd;
}

.indicator-wrap{
  text-align:center;
}

label{
  display:block;
  font-weight:bold;
  font-size:14px;
  color:#334155;
  margin:14px 0 6px;
}

input, select{
  width:100%;
  padding:14px;
  border:1.5px solid #cbd5e1;
  border-radius:12px;
  font-size:15px;
  background:#f8fafc;
  outline:none;
  transition:border-color 0.25s ease, box-shadow 0.25s ease, transform 0.2s ease;
}

input:focus, select:focus{
  border-color:#0284c7;
  background:#ffffff;
  box-shadow:0 0 0 4px rgba(2,132,199,0.15);
  transform:translateY(-1px);
}

button{
  width:100%;
  padding:14px;
  border:none;
  border-radius:12px;
  background:linear-gradient(135deg,#0284c7,#2563eb);
  color:white;
  font-size:16px;
  font-weight:bold;
  cursor:pointer;
  margin-top:16px;
  transition:transform 0.25s ease, box-shadow 0.25s ease;
  box-shadow:0 4px 14px rgba(37,99,235,0.3);
}

button:hover{
  transform:translateY(-2px);
  box-shadow:0 8px 25px rgba(37,99,235,0.45);
}

button:active{
  transform:translateY(0);
}

.back{
  background:#475569;
  box-shadow:0 4px 12px rgba(71,85,105,0.25);
  margin-top:10px;
}

.back:hover{
  background:#334155;
  box-shadow:0 8px 20px rgba(71,85,105,0.35);
}

.msg{
  display:none;
  padding:13px;
  margin-top:15px;
  border-radius:10px;
  text-align:center;
  font-weight:bold;
  font-size:14px;
  animation:slideDown 0.3s ease;
}

.error{
  background:#fee2e2;
  color:#991b1b;
  border:1px solid #fca5a5;
}

.preview{
  display:none;
  width:110px;
  height:110px;
  border-radius:50%;
  object-fit:cover;
  margin:14px auto;
  border:3px solid #38bdf8;
  animation:pulseGlow 2.5s infinite;
}

.login-link{
  text-align:center;
  margin-top:15px;
}

.login-link a{
  color:#0284c7;
  font-weight:bold;
  text-decoration:none;
}

.login-link a:hover{
  text-decoration:underline;
}
</style>
</head>

<body>

<div class="container">

<div class="header">
  <h1>🏦 S.K Zero Balance Bank</h1>
  <p>New Customer Onboarding Portal</p>
</div>

<div class="card" id="registerCard">
  <h2>Customer Registration</h2>

  <!-- STEP 1 -->
  <div class="step active" id="step1">
    <div class="indicator-wrap">
      <span class="step-indicator">Step 1 of 3 - Personal Details</span>
    </div>

    <label>First Name</label>
    <input id="firstName" type="text" placeholder="Enter first name">

    <label>Last Name</label>
    <input id="lastName" type="text" placeholder="Enter last name">

    <label>Gender</label>
    <select id="gender">
      <option value="">Select Gender</option>
      <option>Male</option>
      <option>Female</option>
      <option>Other</option>
    </select>

    <label>Date of Birth</label>
    <input id="dob" type="date">

    <button onclick="nextStep2()">Next Step &rarr;</button>
    <div class="login-link">Already registered? <a href="login.html">Login here</a></div>
  </div>

  <!-- STEP 2 -->
  <div class="step" id="step2">
    <div class="indicator-wrap">
      <span class="step-indicator">Step 2 of 3 - Contact Details</span>
    </div>

    <label>Mobile Number</label>
    <input id="mobile" type="tel" maxlength="10" placeholder="10-digit mobile number">

    <label>Email ID</label>
    <input id="email" type="email" placeholder="example@domain.com">

    <label>Upload Photo</label>
    <input id="photo" type="file" accept="image/*" onchange="loadPhoto(event)">

    <img id="preview" class="preview" alt="Preview Photo">

    <button onclick="nextStep3()">Submit & Next &rarr;</button>
    <button class="back" onclick="showStep(1)">&larr; Back</button>
  </div>

  <!-- STEP 3 -->
  <div class="step" id="step3">
    <div class="indicator-wrap">
      <span class="step-indicator">Step 3 of 3 - Verification</span>
    </div>

    <label>12-Digit Identification Number</label>
    <input id="idNumber" type="text" maxlength="12" placeholder="Enter 12-digit number">

    <button onclick="registerCustomer()">Submit Registration</button>
    <button class="back" onclick="showStep(2)">&larr; Back</button>
  </div>

  <div id="registerMsg" class="msg"></div>
</div>

</div>

<script>
const CUSTOMER_KEY = "sk_zero_balance_customer";

let data = {
  firstName: "",
  lastName: "",
  gender: "",
  dob: "",
  mobile: "",
  email: "",
  photo: "",
  idNumber: ""
};

function msg(id, text, type){
  let e = document.getElementById(id);
  e.textContent = text;
  e.className = "msg " + type;
  e.style.display = "block";
}

function showStep(n){
  document.querySelectorAll(".step").forEach(x => x.classList.remove("active"));
  document.getElementById("step" + n).classList.add("active");
}

function age(dob){
  let d = new Date(dob);
  let t = new Date();
  let a = t.getFullYear() - d.getFullYear();
  if(t.getMonth() < d.getMonth() || (t.getMonth() === d.getMonth() && t.getDate() < d.getDate())) {
    a--;
  }
  return a;
}

function nextStep2(){
  let first = document.getElementById("firstName").value.trim();
  let last = document.getElementById("lastName").value.trim();
  let gender = document.getElementById("gender").value;
  let dob = document.getElementById("dob").value;

  if(!first || !last || !gender || !dob){
    msg("registerMsg", "Please fill all details.", "error");
    return;
  }

  if(age(dob) < 18){
    msg("registerMsg", "Customer must be 18 years or above.", "error");
    return;
  }

  data.firstName = first;
  data.lastName = last;
  data.gender = gender;
  data.dob = dob;

  showStep(2);
  document.getElementById("registerMsg").style.display = "none";
}

function loadPhoto(event){
  let file = event.target.files[0];
  if(!file) return;

  let reader = new FileReader();
  reader.onload = function(e){
    data.photo = e.target.result;
    let img = document.getElementById("preview");
    img.src = e.target.result;
    img.style.display = "block";
  };
  reader.readAsDataURL(file);
}

function nextStep3(){
  let mobile = document.getElementById("mobile").value.trim();
  let email = document.getElementById("email").value.trim();

  if(!/^[0-9]{10}$/.test(mobile)){
    msg("registerMsg", "Enter valid 10 digit mobile number.", "error");
    return;
  }

  if(!email.includes("@")){
    msg("registerMsg", "Enter valid email ID.", "error");
    return;
  }

  if(!data.photo){
    msg("registerMsg", "Please upload photo.", "error");
    return;
  }

  data.mobile = mobile;
  data.email = email;

  showStep(3);
}

function customerId(){
  return "SKC" + Math.floor(10000000 + Math.random() * 90000000);
}

function accountNumber(){
  return "SKCA" + Math.floor(10000000 + Math.random() * 90000000);
}

function registerCustomer(){
  let idNumber = document.getElementById("idNumber").value.replace(/\s/g, "");

  if(!/^[0-9]{12}$/.test(idNumber)){
    msg("registerMsg", "Enter valid 12-digit identification number.", "error");
    return;
  }

  data.idNumber = idNumber;

  let customer = {
    bankName: "S.K Zero Balance Bank",
    customerId: customerId(),
    accountNumber: accountNumber(),
    firstName: data.firstName,
    lastName: data.lastName,
    fullName: data.firstName + " " + data.lastName,
    gender: data.gender,
    dob: data.dob,
    mobile: data.mobile,
    email: data.email,
    photo: data.photo,
    idNumber: data.idNumber,
    balance: 0,
    transactions: [],
    status: "NOT APPROVED",
    managerApproval: false,
    employeeApproval: false,
    accountActive: false,
    createdAt: new Date().toISOString()
  };

  const formData = new FormData();
  formData.append("role", "customer");
  formData.append("name", customer.fullName);
  formData.append("mobile", customer.mobile);
  formData.append("email", customer.email);
  formData.append("password", customer.idNumber);
  formData.append("dob", customer.dob);
  formData.append("gender", customer.gender);
  formData.append("photo", customer.photo);
  formData.append("account_number", customer.accountNumber);
  formData.append("customer_id", customer.customerId);

  fetch("../../register.php", { method: "POST", body: formData })
    .then(response => response.json())
    .then(result => {
      if(!result.success){
        msg("registerMsg", result.message, "error");
        return;
      }

      localStorage.setItem(CUSTOMER_KEY, JSON.stringify(customer));
      alert(
        "Registration Successful!\n\n" +
        "Customer ID: " + customer.customerId + "\n" +
        "Account Number: " + customer.accountNumber + "\n\n" +
        "Your registration was saved to MySQL."
      );
      window.location.href = "login.html";
    })
    .catch(() => msg("registerMsg", "Could not connect to the XAMPP MySQL server.", "error"));
}
</script>

</body>
</html>

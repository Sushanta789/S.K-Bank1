<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bank Portal</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #f4f7fb, #dfeafc);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .container {
      width: min(90%, 900px);
      background: #ffffff;
      border-radius: 18px;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.12);
      padding: 50px 30px;
      text-align: center;
    }

    h1 {
      margin-bottom: 30px;
      color: #1f2d3d;
      font-size: 2.2rem;
    }

    .button-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 20px;
      margin-top: 20px;
    }

    .btn {
      display: inline-block;
      text-decoration: none;
      background: linear-gradient(135deg, #2a6df4, #1f4ecb);
      color: white;
      padding: 18px 20px;
      border-radius: 12px;
      font-size: 1.1rem;
      font-weight: bold;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
      box-shadow: 0 8px 18px rgba(42, 109, 244, 0.2);
    }

    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 22px rgba(42, 109, 244, 0.28);
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Bank Management System</h1>
    <div class="button-grid">
      <a class="btn" href="Admin/admin.html">Admin</a>
      <a class="btn" href="manager.html">Manager</a>
      <a class="btn" href="Employee/employee.html">Employee</a>
      <a class="btn" href="Employee/Customer/login.html">Customer</a>
      <a class="btn" href="search.html">Search</a>
      <a class="btn" href="Manager/deposit.html">Deposit</a>
      <a class="btn" href="Manager/transaction.html">Transaction</a>
      <a class="btn" href="Delete/Delete Manager Account/Delete Manager Account.html">Delete Manager Account</a>
      <a class="btn" href="Delete/Delete Employee Account/Delete Employee Account.html">Delete Employee Account</a>
      <a class="btn" href="Delete/Delete Customer Account/Delete Customer Account.html">Delete Customer Account</a>
    </div>
  </div>
</body>
</html>

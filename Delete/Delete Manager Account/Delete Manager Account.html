<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Delete Manager Account</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #061b3a, #087f8c);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .card {
      width: min(100%, 480px);
      background: #fff;
      border-radius: 18px;
      box-shadow: 0 15px 40px rgba(0,0,0,0.25);
      padding: 30px 25px;
    }
    h2 { text-align: center; color: #073b66; margin-bottom: 20px; }
    label { display: block; font-weight: bold; margin-bottom: 8px; color: #333; }
    input {
      width: 100%;
      padding: 12px 14px;
      font-size: 16px;
      border: 1px solid #ccc;
      border-radius: 10px;
      margin-bottom: 16px;
    }
    button {
      width: 100%;
      padding: 14px;
      font-size: 16px;
      font-weight: bold;
      color: #fff;
      background: #c0392b;
      border: none;
      border-radius: 10px;
      cursor: pointer;
    }
    button:hover { background: #a22d22; }
    .message {
      display: none;
      margin-top: 16px;
      padding: 12px;
      border-radius: 8px;
      font-weight: bold;
      text-align: center;
    }
    .success { background: #d8f5df; color: #146c2e; }
    .error { background: #ffe0e0; color: #a11a1a; }
  </style>
</head>
<body>
  <div class="card">
    <h2>Delete Manager Account</h2>
    <form id="deleteForm">
      <label for="accountNumber">Manager Account Number</label>
      <input type="text" id="accountNumber" placeholder="Enter Manager Account Number" required />
      <button type="submit">Delete Account</button>
    </form>
    <div id="message" class="message"></div>
  </div>

  <script>
    document.getElementById('deleteForm').addEventListener('submit', async function (e) {
      e.preventDefault();

      const accountNumber = document.getElementById('accountNumber').value.trim();
      const messageBox = document.getElementById('message');

      if (!accountNumber) {
        messageBox.className = 'message error';
        messageBox.textContent = 'Please enter the manager account number.';
        messageBox.style.display = 'block';
        return;
      }

      try {
        const formData = new FormData();
        formData.append('account_number', accountNumber);

        const response = await fetch('delete_manager.php', {
          method: 'POST',
          body: formData
        });

        const result = await response.json();

        messageBox.className = 'message ' + (result.success ? 'success' : 'error');
        messageBox.textContent = result.message;
        messageBox.style.display = 'block';

        if (result.success) {
          document.getElementById('deleteForm').reset();
        }
      } catch (error) {
        messageBox.className = 'message error';
        messageBox.textContent = 'Failed to delete manager account.';
        messageBox.style.display = 'block';
      }
    });
  </script>
</body>
</html>
